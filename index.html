<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>deneyy/deney.py</title>
</head>
<body>

<h1>deneyy/deney.py</h1>
<p><a href="https://github.com/deneyy/deney.py" target="_blank">https://github.com/deneyy/deney.py</a></p>
<p id="statusText">connecting…</p>
<p id="lastUpdated">Last checked: —</p>

<ul id="fileList">
  <li>Loading repository contents…</li>
</ul>

<script>
  const OWNER = "deneyy";
  const REPO = "deney.py";
  const BRANCH = "main";
  const POLL_MS = 30000;

  const fileListEl = document.getElementById("fileList");
  const statusTextEl = document.getElementById("statusText");
  const lastUpdatedEl = document.getElementById("lastUpdated");

  let knownPaths = new Set();
  let firstLoad = true;

  function formatBytes(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / (1024 * 1024)).toFixed(1) + " MB";
  }

  async function fetchTree() {
    const url = `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`;
    const res = await fetch(url, { headers: { "Accept": "application/vnd.github+json" } });
    if (!res.ok) {
      if (res.status === 403) throw new Error("rate limited by GitHub — will retry");
      throw new Error(`GitHub API error (${res.status})`);
    }
    const data = await res.json();
    return data.tree || [];
  }

  function render(tree) {
    const items = tree
      .filter(i => i.type === "blob" || i.type === "tree")
      .sort((a, b) => {
        if (a.type !== b.type) return a.type === "tree" ? -1 : 1;
        return a.path.localeCompare(b.path);
      });

    if (items.length === 0) {
      fileListEl.innerHTML = "<li>Repository is empty.</li>";
      return;
    }

    const currentPaths = new Set(items.map(i => i.path));
    const isNew = (path) => !firstLoad && !knownPaths.has(path);

    fileListEl.innerHTML = items.map(item => {
      const blobUrl = item.type === "blob"
        ? `https://github.com/${OWNER}/${REPO}/blob/${BRANCH}/${item.path}`
        : `https://github.com/${OWNER}/${REPO}/tree/${BRANCH}/${item.path}`;
      const rawUrl = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${item.path}`;
      const meta = item.type === "blob" && item.size != null ? formatBytes(item.size) : "dir";
      const newTag = isNew(item.path) ? " [NEW]" : "";

      return `<li>
        ${item.type === "tree" ? "[dir] " : ""}<a href="${blobUrl}" target="_blank">${item.path}</a>
        ${item.type === "blob" ? ` (<a href="${rawUrl}" target="_blank">raw</a>)` : ""}
        - ${meta}${newTag}
      </li>`;
    }).join("");

    knownPaths = currentPaths;
    firstLoad = false;
  }

  async function poll() {
    try {
      const tree = await fetchTree();
      render(tree);
      statusTextEl.textContent = "Status: live";
      lastUpdatedEl.textContent = "Last checked: " + new Date().toLocaleTimeString();
    } catch (err) {
      statusTextEl.textContent = "Status: " + (err.message || "error fetching repo");
      if (firstLoad) {
        fileListEl.innerHTML = `<li>Couldn't load repository: ${err.message}</li>`;
      }
      lastUpdatedEl.textContent = "Last attempt: " + new Date().toLocaleTimeString();
    }
  }

  poll();
  setInterval(poll, POLL_MS);
</script>

</body>
</html>
